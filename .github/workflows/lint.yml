# ──────────────────────────────────────────────────────────────
# Workflow: CI — Quality Gate
# Propósito: Verificar código, documentación y guardias operativas en cada
#            push o pull request a la rama main.
#
# ¿Qué hace?
#   1. Instala Node.js y las dependencias del proyecto.
#   2. Corre exactamente npm run verify, igual que el gate local.
#   3. Reporta advertencias y errores en la pestaña Actions de GitHub.
#
# ¿Bloquea el push? NO. Solo informa.
# ¿Modifica el código?  NO. Solo lee y reporta.
# ──────────────────────────────────────────────────────────────

name: CI — Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Verificar calidad integral
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js (misma versión LTS que usamos localmente)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # 3. Configurar Python para scripts documentales
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Diagnosticar versiones antes de instalar o ejecutar tests
      - name: Verificar entorno canónico
        run: npm run check:runtime

      # 5. Instalar dependencias (usa el package-lock.json para reproducibilidad)
      - name: Instalar dependencias
        run: npm ci

      # 6. Unión de controles local/CI; sin lista alternativa ni binario ignorado
      - name: Ejecutar gate canónico completo
        run: npm run verify
