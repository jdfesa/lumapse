<text xml:space="preserve" text-anchor="start" x="2" y="-249.6" font-family="DejaVu Sans" font-weight="bold" font-size="12.00">REFERENCIAS · FK → PK (todas admiten NULL)</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-232.5" font-family="DejaVu Sans" font-size="12.00">subjects.parentSubjectId → subjects.id · ON DELETE CASCADE¹</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-216.25" font-family="DejaVu Sans" font-size="12.00">notes.subjectId → subjects.id · ON DELETE SET NULL</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-200" font-family="DejaVu Sans" font-size="12.00">academic_events.subjectId → subjects.id · ON DELETE SET NULL</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-183.75" font-family="DejaVu Sans" font-size="12.00">Destino: 0..N referencias. ON UPDATE no declarado: NO ACTION.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-168.35" font-family="DejaVu Sans" font-weight="bold" font-size="12.00">RESTRICCIONES E ÍNDICES FÍSICOS</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-151.25" font-family="DejaVu Sans" font-size="12.00">academic_events.type: CHECK (type IN (&#39;parcial&#39;, &#39;final&#39;, &#39;tp&#39;, &#39;exposicion&#39;))</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-135" font-family="DejaVu Sans" font-size="12.00">Índices explícitos no únicos en academic_events:</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-118.75" font-family="DejaVu Sans" font-size="12.00">idx_academic_events_date (date) · idx_academic_events_subject (subjectId)</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-103.35" font-family="DejaVu Sans" font-weight="bold" font-size="12.00">LECTURA Y LÍMITES</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-86.25" font-family="DejaVu Sans" font-size="12.00">PK: PRIMARY KEY · FK: FOREIGN KEY · NN: NOT NULL explícito · D=0: DEFAULT 0.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-70" font-family="DejaVu Sans" font-size="12.00">Sin NN se admite NULL, incluso en estas PK; sin DEFAULT, la omisión es NULL.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-53.75" font-family="DejaVu Sans" font-size="12.00">¹ Sección → otra fila materia raíz; raíz: parentSubjectId=NULL.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-37.5" font-family="DejaVu Sans" font-size="12.00">Dos niveles y nombres por nivel: servicio; la FK no evita ciclos ni fija profundidad.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-21.25" font-family="DejaVu Sans" font-size="12.00">Sin CHECK de UUID, formato de fecha o indicadores 0/1. metadata: sin FK.</text>
<text xml:space="preserve" text-anchor="start" x="2" y="-5" font-family="DejaVu Sans" font-size="12.00">ON DELETE corresponde al borrado físico, no a deletedAt (papelera).</text>
