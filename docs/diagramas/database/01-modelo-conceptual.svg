<g id="node20" class="node">
<title>roles</title>
<text xml:space="preserve" text-anchor="middle" x="284.82" y="-140.51" font-family="Arial" font-size="14.00">Se repite Subject para distinguir sus roles, no para agregar entidades.</text>
<text xml:space="preserve" text-anchor="middle" x="284.82" y="-124.76" font-family="Arial" font-size="14.00">Una materia no tiene padre; cada sección tiene una materia padre.</text>
<text xml:space="preserve" text-anchor="middle" x="284.82" y="-109.01" font-family="Arial" font-size="14.00">La relación une registros distintos. No se admiten subsecciones.</text>
</g>
