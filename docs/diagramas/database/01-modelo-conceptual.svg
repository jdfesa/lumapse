<text xml:space="preserve" text-anchor="middle" x="284.82" y="-39.71" font-family="Arial" font-size="14.00">Rectángulo: entidad · Rombo: relación · Óvalo: atributo.</text>
<text xml:space="preserve" text-anchor="middle" x="284.82" y="-23.96" font-family="Arial" font-size="14.00">(mín, máx) junto a la entidad: cantidad de vínculos en los que participa.</text>
<text xml:space="preserve" text-anchor="middle" x="284.82" y="-8.21" font-family="Arial" font-size="14.00">N = muchos · Identificador subrayado · Atributos seleccionados.</text>
